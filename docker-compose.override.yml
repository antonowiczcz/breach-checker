# Konfiguracja deweloperska - Compose dokłada ten plik automatycznie do docker-compose.yml
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev    # obraz z pytest, serwer Flask w trybie debug
    volumes:
      - ./backend:/app              # kod z hosta zamiast kodu z obrazu

  frontend:
    volumes:
      # Tylko pliki strony - montowanie całego ./frontend wystawiłoby nginx.conf i Dockerfile
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/style.css:/usr/share/nginx/html/style.css:ro
      - ./frontend/script.js:/usr/share/nginx/html/script.js:ro
